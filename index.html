<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Classroom Compass Pro · بوصلة الصف برو</title>
<meta name="description" content="أداة مجانية للمعلم: إدارة الصف، النقاط والحضور، تحليل الدرجات، الخطط العلاجية والإثرائية ومتابعة التحسن — تطوير المعلم أحمد القطناني">
<meta name="theme-color" content="#153D2B">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;700;800&family=Readex+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: header + tab bar; Classroom = projector board beside a controls rail; other tabs are single-column work sheets. */
:root{
  --bg:#EEF2EE; --panel:#FFFFFF; --ink:#13201A; --muted:#55675C; --rule:#D5DED7;
  --accent:#1D6A45; --on-accent:#FFFFFF; --tint:#E1EEE6;
  --gold:#C98A12; --danger:#B23D27; --late:#A86A00; --absent:#B23D27;
  --board:#153D2B; --board-deep:#0E2C1F; --chalk:#FFFFFF; --sun:#F4B73E; --coral:#FF8466; --line:rgba(255,255,255,.26);
  --display:"Baloo Bhaijaan 2","Segoe UI",Tahoma,system-ui,sans-serif;
  --ui:"Readex Pro","Segoe UI",Tahoma,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1510; --panel:#14201A; --ink:#E8EFEA; --muted:#9BAFA3; --rule:#263830;
    --accent:#6CCB98; --on-accent:#0C1510; --tint:#1A2D23;
    --gold:#F4B73E; --danger:#FF8A72; --late:#F0B44A; --absent:#FF8A72; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1510; --panel:#14201A; --ink:#E8EFEA; --muted:#9BAFA3; --rule:#263830;
  --accent:#6CCB98; --on-accent:#0C1510; --tint:#1A2D23;
  --gold:#F4B73E; --danger:#FF8A72; --late:#F0B44A; --absent:#FF8A72; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{min-height:100%;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--ui);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{background:var(--board);color:#fff}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:12px}
.brand{font:800 22px/1.1 var(--display);margin:0;display:flex;align-items:center;gap:10px;margin-inline-end:auto}
.brand svg{flex:none}
.top-actions{display:flex;flex-wrap:wrap;gap:6px}
.tbtn{min-height:38px;border:1px solid rgba(255,255,255,.32);background:transparent;color:#fff;border-radius:999px;padding:0 13px;font-size:13.5px;font-weight:500}
.tbtn:hover{background:rgba(255,255,255,.1)}
.tbtn.on{background:var(--sun);border-color:var(--sun);color:#13201A}
.tabs{background:var(--panel);border-bottom:1px solid var(--rule);position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:6px}
.tabs button{flex:none;border:0;background:transparent;border-radius:8px;padding:9px 13px;font-weight:500;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--tint);color:var(--accent)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--panel)}
main{padding-block:18px 40px}
.view{display:block}
.sheet{max-width:1080px;margin:0 auto}
.sheet h2{font:700 26px/1.15 var(--display);margin:0 0 6px}
.lede{color:var(--muted);margin:0 0 18px;max-width:62ch}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:13.5px;font-weight:500}
.field small{color:var(--muted);font-size:12.5px}
input[type=text],input[type=tel],input[type=number],select,textarea{width:100%;min-height:44px;border:1px solid var(--rule);border-radius:10px;background:var(--panel);padding:9px 12px}
textarea{resize:vertical;min-height:120px;line-height:1.5}
.btn{min-height:44px;border-radius:10px;border:1px solid var(--rule);background:var(--panel);padding:0 14px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--danger)}
.btn.sm{min-height:36px;padding:0 10px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:default}
.muted{color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:0}
.empty{padding:22px;text-align:center;color:var(--muted)}
.empty .btn{margin-top:10px}

/* classroom */
.room{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;align-items:start;max-width:1500px;margin:0 auto}
.stage-col{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);min-width:0}
@media (max-width:900px){ .room{grid-template-columns:1fr} .stage-col{position:static} }
.stage{position:relative;container-type:size;height:clamp(300px,64vh,760px);background:var(--board);color:var(--chalk);border-radius:14px;overflow:hidden;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.stage .frame{position:absolute;inset:2.2cqmin;border:.45cqmin solid var(--line);border-radius:1.2cqmin;pointer-events:none}
.st-top{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:flex-start;gap:3cqmin;padding:5cqmin 6cqmin 0}
.st-class{font:700 max(15px,4.2cqmin)/1.15 var(--display);overflow-wrap:anywhere}
.st-class small{display:block;font:500 max(11px,2.4cqmin)/1.3 var(--ui);opacity:.85}
.clock{font:800 max(20px,6.6cqmin)/1 var(--display);font-variant-numeric:tabular-nums;background:var(--board-deep);color:var(--sun);padding:1.4cqmin 2.6cqmin 1cqmin;border-radius:1.4cqmin;text-align:center;min-width:5ch}
.clock.low{color:var(--coral)}
.clock.done{background:var(--coral);color:#13201A;animation:blink 1s steps(2,jump-none) infinite}
.clock-note{font:700 max(12px,2.8cqmin)/1.2 var(--display);text-align:center;margin:1cqmin 0 0;min-height:1.2em}
.centre{position:relative;z-index:1;display:grid;place-items:center;min-height:0;padding:1cqmin 4cqmin}
.disc{width:min(70cqmin,92cqw);aspect-ratio:1;max-width:100%;border-radius:50%;background:var(--board-deep);border:.45cqmin solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:5cqmin;gap:1.6cqmin}
.who{font:800 calc(12.5cqmin*var(--k,1))/1.02 var(--display);margin:0;max-width:100%;overflow-wrap:anywhere}
.pts{font:800 max(22px,7cqmin)/1 var(--display);color:var(--sun);margin:0;display:flex;gap:1.4cqmin;align-items:baseline}
.pts small{font:500 max(11px,2.5cqmin)/1 var(--ui);color:rgba(255,255,255,.88)}
.msg{font:700 max(15px,4.3cqmin)/1.1 var(--display);margin:0;min-height:1.1em}
.msg.minus{color:var(--coral)}
.idle-t{font:800 max(24px,8cqmin)/1.02 var(--display);margin:0}
.idle-h{font:400 max(12px,2.7cqmin)/1.45 var(--ui);margin:0;max-width:24em;opacity:.92}
.pop .pts{animation:pop .55s cubic-bezier(.2,1.7,.4,1)}
.pop .who{animation:rise .45s ease-out}
.wheel{position:relative;width:min(74cqmin,88cqw);aspect-ratio:1;max-width:100%}
.wheel-rot{width:100%;height:100%}
.wheel svg{display:block;width:100%;height:100%}
.wheel text{font-family:var(--display);font-weight:700;fill:#13201A}
.pin{position:absolute;right:-2.2cqmin;top:50%;border-top:2.6cqmin solid transparent;border-bottom:2.6cqmin solid transparent;border-right:5.2cqmin solid #fff;transform:translateY(-50%);filter:drop-shadow(0 0 .4cqmin rgba(0,0,0,.6))}
.wheel-idle{display:flex;flex-direction:column;align-items:center;gap:2cqmin}
.wheel-idle p{font:700 max(14px,3.6cqmin)/1 var(--display);margin:0}
.noise{position:relative;z-index:2;margin:0 6cqmin 4.5cqmin;display:grid;grid-template-columns:auto 1fr auto;gap:2cqmin;align-items:center;font:600 max(12px,2.6cqmin)/1 var(--ui)}
.noise-bar{height:max(12px,3.2cqmin);border-radius:999px;background:rgba(255,255,255,.16);overflow:hidden;position:relative}
.noise-bar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--sun);border-radius:999px;transition:width .15s linear,background .2s}
[dir=rtl] .noise-bar i{inset:0 0 0 auto}
.noise-bar i.loud{background:var(--coral)}
.noise-bar i.ok{background:#8FE0B1}
.stage.has-noise .disc{width:min(56cqmin,92cqw)}
body.tools .noise{margin-bottom:calc(4.5cqmin + 58px)}
.noise-face{font:800 max(14px,3.4cqmin)/1 var(--display);min-width:7ch;text-align:end}
.star{position:absolute;inset:0;z-index:5;background:var(--sun);color:#13201A;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2cqmin;text-align:center;padding:8cqmin 6cqmin;overflow:hidden}
.star-t{font:700 max(18px,5.8cqmin)/1 var(--display);margin:0}
.star-n{font:800 calc(14cqmin*var(--k,1))/1.02 var(--display);margin:0;overflow-wrap:anywhere;position:relative;z-index:1}
.star-p{font:600 max(13px,3.4cqmin)/1.2 var(--ui);margin:0;position:relative;z-index:1}
.star-x{position:absolute;top:16px;inset-inline-end:16px;z-index:2;background:transparent;border:2px solid #13201A;color:#13201A;border-radius:999px;padding:8px 14px;font-size:13px}
.star i{position:absolute;top:-8%;width:1.5cqmin;height:3cqmin;border-radius:.3cqmin;animation:fall linear forwards;pointer-events:none}
.solo-x{display:none}
@keyframes fall{to{transform:translateY(125cqh) rotate(720deg)}}
@keyframes pop{0%{transform:scale(.5)}100%{transform:scale(1)}}
@keyframes rise{0%{transform:translateY(12%);opacity:0}100%{transform:none;opacity:1}}
@keyframes blink{0%{opacity:1}50%{opacity:.45}}
.stage-sub{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;margin-top:8px;font-size:13px;color:var(--muted)}

/* controls rail */
.rail{display:flex;flex-direction:column;gap:14px;min-width:0}
.rail .card{padding:14px}
.rail h3{font:600 13px/1.3 var(--ui);color:var(--muted);margin:0 0 9px;letter-spacing:.02em}
.tool-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.tool-grid .btn{font-size:14px;padding:0 8px;justify-content:flex-start;text-align:start;line-height:1.2}
.tool-grid .btn.on{background:var(--tint);border-color:var(--accent);color:var(--accent)}
.act-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.act-grid .btn{padding:0 4px;font-size:13px;flex-direction:column;gap:0;min-height:54px;line-height:1.15}
.act-grid .btn b{font:800 18px/1 var(--display)}
.act-grid .plus b{color:var(--accent)} .act-grid .minus b{color:var(--danger)}
.timer-row{display:flex;align-items:center;gap:8px}
.timer-read{font:800 30px/1 var(--display);font-variant-numeric:tabular-nums;min-width:4.3ch}
.timer-row .btn{flex:1;white-space:nowrap;padding:0 8px}
.presets{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:8px}
.presets button{min-height:36px;border-radius:8px;border:1px solid var(--rule);background:var(--panel);font-size:13px;padding:0}
.presets button[aria-pressed="true"]{background:var(--tint);border-color:var(--accent);color:var(--accent);font-weight:600}
.custom-min{display:flex;gap:6px;margin-top:6px;align-items:center}
.custom-min input{width:90px;min-height:36px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{min-height:38px;border-radius:999px;border:1px solid var(--rule);background:var(--panel);padding:0 13px;font-size:13.5px}
.chips button:disabled{opacity:.45;cursor:default}
.check{display:flex;gap:9px;align-items:center;font-size:13.5px;color:var(--muted);margin-top:8px}
.check input{width:19px;height:19px;accent-color:var(--accent);flex:none}
.roster{list-style:none;margin:0;padding:0}
.st{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--rule);padding:4px 0;padding-inline-start:8px;border-inline-start:4px solid transparent}
.st.active{background:var(--tint);border-inline-start-color:var(--accent)}
.st.absent .st-name span{text-decoration:line-through;opacity:.6}
.st-name{flex:1;min-width:0;text-align:start;background:none;border:0;padding:7px 2px;min-height:44px;font-weight:500;overflow-wrap:anywhere}
.st-name small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.att{flex:none;width:34px;height:34px;border-radius:8px;border:1px solid var(--rule);background:var(--panel);font-weight:700;font-size:13px;padding:0}
.att.P{color:var(--accent)} .att.A{color:var(--absent);border-color:var(--absent)} .att.L{color:var(--late);border-color:var(--late)}
.st-pts{font:800 21px/1 var(--display);min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.pm{width:42px;height:42px;flex:none;border-radius:50%;font:700 21px/1 var(--display);padding:0}
.pm.plus{background:var(--accent);border:0;color:var(--on-accent)}
.pm.minus{background:transparent;border:2px solid var(--rule);color:var(--danger)}
.sync{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none;margin-top:5px}
.dot.ok{background:var(--accent)} .dot.busy{background:var(--gold)} .dot.off{background:var(--danger)}
.links{display:flex;flex-wrap:wrap;gap:4px 16px}
.link{background:none;border:0;padding:8px 0;color:var(--accent);font-weight:500;font-size:13.5px;text-decoration:underline;text-underline-offset:3px}
.link.danger{color:var(--danger)}
.sel-row{display:flex;gap:8px}
.sel-row select{flex:1;min-width:0}

/* tables & stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:12px 14px}
.stat span{font-size:13px;color:var(--muted)}
.stat b{display:block;font:800 30px/1.1 var(--display);font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:12px;background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:start;padding:10px 12px;border-bottom:1px solid var(--rule);white-space:nowrap}
th{font-size:12.5px;color:var(--muted);font-weight:600;background:var(--tint)}
td.num,th.num{text-align:end;font-variant-numeric:tabular-nums}
td.neg{color:var(--danger)}
tr:last-child td{border-bottom:0}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin-bottom:12px}
.toolbar .field{min-width:150px}
.subhead{font:700 18px/1.2 var(--display);margin:22px 0 10px}
.pill{display:inline-block;font-size:12px;border-radius:999px;padding:2px 9px;border:1px solid var(--rule)}
.pill.A{color:var(--absent);border-color:var(--absent)} .pill.L{color:var(--late);border-color:var(--late)} .pill.P{color:var(--accent);border-color:var(--accent)}

/* stars */
.starcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.starcard{border-radius:14px;padding:22px;background:var(--board);color:#fff;display:flex;flex-direction:column;gap:6px;min-height:200px}
.starcard.gold{background:var(--sun);color:#13201A}
.starcard h3{font:700 16px/1.2 var(--ui);margin:0;opacity:.9}
.starcard .big{font:800 clamp(30px,5vw,46px)/1.05 var(--display);margin:6px 0 2px;overflow-wrap:anywhere}
.starcard .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:12px}
.starcard .btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.4);color:inherit}
.starcard.gold .btn{background:rgba(19,32,26,.06);border-color:rgba(19,32,26,.4)}
.lb{list-style:none;margin:0;padding:0;counter-reset:r}
.lb li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule)}
.lb li span:first-child{overflow-wrap:anywhere;min-width:0}
.lb li b{font-variant-numeric:tabular-nums}

/* homework list, messages */
.hw{border-bottom:1px solid var(--rule);padding:12px 0;display:flex;gap:10px;align-items:flex-start}
.hw:last-child{border-bottom:0}
.hw div{flex:1;min-width:0}
.hw b{display:block}
.hw p{margin:2px 0 0;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
.hw time{font-size:12px;color:var(--muted)}
.out{white-space:pre-wrap;background:var(--tint);border-radius:10px;padding:14px;min-height:90px;margin:0;overflow-wrap:anywhere;font:inherit}
.letter{background:#FFFDF6;color:#13201A;border-radius:12px;padding:26px;border:1px solid var(--rule);white-space:pre-wrap;line-height:1.75;overflow-wrap:anywhere}
.cls-list{list-style:none;margin:0;padding:0}
.cls-list li button{width:100%;text-align:start;border:0;background:none;padding:11px 10px;border-radius:8px;display:flex;justify-content:space-between;gap:8px}
.cls-list li button[aria-current="true"]{background:var(--tint);color:var(--accent);font-weight:600}
.cls-list small{color:var(--muted)}

/* modal, mini, toast */
.modal{position:fixed;inset:0;z-index:60;background:rgba(8,16,12,.55);display:grid;place-items:center;padding:16px}
.dialog{background:var(--panel);border-radius:14px;max-width:440px;width:100%;padding:22px;position:relative;max-height:calc(100% - 32px);overflow:auto}
.dialog h2{font:700 22px/1.2 var(--display);margin:0 0 10px}
.dialog .x{position:absolute;top:12px;inset-inline-end:12px;width:40px;height:40px;border-radius:50%;border:1px solid var(--rule);background:var(--panel);font-size:16px}
.qr{background:#fff;padding:14px;border-radius:10px;display:grid;place-items:center;margin:12px 0;min-height:120px}
.qr img,.qr canvas{width:220px!important;height:220px!important;max-width:100%}
.urlbox{font-size:12.5px;background:var(--tint);border-radius:8px;padding:8px 10px;overflow-wrap:anywhere;user-select:all;margin:0 0 12px}
.mini{position:fixed;z-index:50;width:300px;max-width:calc(100vw - 24px);background:var(--board);color:#fff;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.35);padding:10px 12px 12px;touch-action:none}
.mini-head{display:flex;align-items:center;gap:8px;cursor:grab;padding-bottom:6px;user-select:none}
.mini-head:active{cursor:grabbing}
.mini-head b{font:700 14px/1.1 var(--display);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-clock{font:800 20px/1 var(--display);color:var(--sun);font-variant-numeric:tabular-nums}
.mini-stu{display:flex;align-items:center;gap:6px;margin:2px 0 6px}
.mini-stu .mini-who{flex:1;min-width:0;margin:0;text-align:center}
.mini-step{width:34px;height:34px;flex:none;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;padding:0;font-size:13px}
.mini-who{font:800 24px/1.1 var(--display);margin:2px 0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-who small{font:500 13px var(--ui);color:var(--sun)}
.mini-btns{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}

function showLogin(startMode){
  return new Promise(function(resolve){
    if(!document.getElementById('ccpLCSS')){ var st = document.createElement('style'); st.id = 'ccpLCSS'; st.textContent = LCSS; document.head.appendChild(st); }
    var host = document.createElement('div'); host.id = 'ccpAuth'; host.setAttribute('role', 'dialog'); host.setAttribute('aria-modal', 'true');
    var mode = startMode || 'in';
    var logo = '<svg width="52" height="52" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="12.5" fill="none" stroke="#F4B73E" stroke-width="2"/><path d="M14 4.5l3.2 9.5L14 23.5 10.8 14z" fill="#F4B73E"/><circle cx="14" cy="14" r="1.8" fill="#153D2B"/></svg>';
    function render(){
      var rtl = lang() === 'ar', up = mode === 'up', adm = mode === 'adm';
      host.dir = rtl ? 'rtl' : 'ltr'; document.documentElement.dir = host.dir; document.documentElement.lang = lang();
      host.innerHTML = '<aside class="lp-side"><div class="lp-logo">' + logo + '<span>' + esc(ltx('brand')) + '</span></div><p class="lp-tag">' + esc(ltx('tag')) + '</p><ul class="lp-f">' + ltx('f').map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul><p class="lp-dev">' + esc(ltx('dev')) + '</p></aside>' +
        '<main class="lp-main"><button class="btn sm lp-lang" type="button" data-m="lang">' + esc(ltx('other')) + '</button><form class="lp-card stack" novalidate>' +
        '<div class="lp-tabs" role="tablist"><button type="button" role="tab" data-m="tab-in" aria-selected="' + (mode === 'in') + '">' + esc(ltx('tin')) + '</button><button type="button" role="tab" data-m="tab-up" aria-selected="' + up + '">' + esc(ltx('tup')) + '</button><button type="button" role="tab" data-m="tab-adm" aria-selected="' + adm + '">' + esc(ltx('tadm')) + '</button></div>' +
        '<div><h2>' + esc(up ? ltx('join') : adm ? ltx('admh') : ltx('welcome')) + '</h2><p class="note">' + esc(up ? ltx('terms') : adm ? ltx('admp') : tx('p')) + '</p></div>' +
        (up ? '<label class="field"><span>' + esc(ltx('name')) + '</span><input type="text" id="ccpName" autocomplete="name" dir="auto" maxlength="80"></label>' : '') +
        '<label class="field"><span>' + esc(tx('email')) + '</span><input type="email" id="ccpEmail" autocomplete="email" dir="ltr"></label>' +
        '<label class="field"><span>' + esc(tx('pass')) + '</span><input type="password" id="ccpPass" autocomplete="' + (up ? 'new-password' : 'current-password') + '" dir="ltr"></label>' +
        '<p class="note" id="ccpMsg" role="status" style="min-height:1.4em"></p>' +
        '<button class="btn primary lp-go" type="submit">' + esc(up ? tx('signup') : adm ? ltx('admgo') : tx('signin')) + '</button>' +
        (up ? '' : '<div><button class="link" type="button" data-m="forgot">' + esc(tx('forgot')) + '</button></div>') +
        (adm ? '' : '<div class="links" style="border-top:1px solid var(--rule);padding-top:10px"><button class="link" type="button" data-m="local">' + esc(tx('local')) + '</button></div>') + '</form></main>';
      var el = host.querySelector(up ? '#ccpName' : '#ccpEmail'); if(el) setTimeout(function(){ el.focus(); }, 30);
    }
    document.body.appendChild(host); render();
    function msgEl(){ return host.querySelector('#ccpMsg'); }
    function say(k, ok){ var m = msgEl(); m.textContent = tx(k); m.style.color = ok ? 'var(--accent)' : 'var(--danger)'; }
    function vals(){ var n = host.querySelector('#ccpName'); return {name: n ? n.value.trim() : '', email:host.querySelector('#ccpEmail').value.trim(), password:host.querySelector('#ccpPass').value}; }
    function busy(on){ Array.prototype.forEach.call(host.querySelectorAll('form button'), function(b){ b.disabled = on; }); if(on) say('wait', true); }
    function done(s){ host.remove(); finish(s, resolve); }
    function fail(e){ busy(false); var m = String(e && e.message || '').toLowerCase(); say(/confirm/.test(m) ? 'unconf' : /invalid|credentials/.test(m) ? 'bad' : /already|registered|exists/.test(m) ? 'exists' : /fetch|network/.test(m) ? 'net' : 'bad'); }
    function act(m){
      if(m === 'lang'){ setLang(lang() === 'ar' ? 'en' : 'ar'); render(); return; }
      if(m === 'tab-in' || m === 'tab-up' || m === 'tab-adm'){ mode = m.slice(4); render(); return; }
      var v = vals();
      if(m === 'local'){ ls('ccp.localonly', '1'); try{ sessionStorage.setItem('ccp.localok', '1'); }catch(x){} host.remove(); resolve(null); return; }
      if(!sb){ say('net'); return; }
      if(m === 'forgot'){ if(!/@/.test(v.email)){ say('need'); return; } busy(true); sb.auth.resetPasswordForEmail(v.email, {redirectTo:location.href.split('#')[0]}).then(function(r){ busy(false); if(r.error) fail(r.error); else say('reset', true); }, fail); return; }
      if(!/@/.test(v.email) || v.password.length < 6){ say('need'); return; }
      busy(true);
      if(mode === 'up'){
        if(v.name) ls('ccp.pendingName', v.name);
        sb.auth.signUp({email:v.email, password:v.password, options:{emailRedirectTo:location.href.split('#')[0], data:{full_name:v.name}}}).then(function(r){
          if(r.error) return fail(r.error);
          if(r.data && r.data.session) return done(r.data.session);
          if(r.data && r.data.user && Array.isArray(r.data.user.identities) && !r.data.user.identities.length){ busy(false); say('exists'); return; }
          busy(false); mode = 'in'; var em = v.email; render(); host.querySelector('#ccpEmail').value = em; say('check', true);
        }, fail);
      } else {
        sb.auth.signInWithPassword({email:v.email, password:v.password}).then(function(r){
          if(r.error) return fail(r.error);
          if(mode !== 'adm') return done(r.data.session);
          sb.rpc('compass_is_admin').then(function(q){
            if(q && q.data === true){ try{ var u = JSON.parse(ls('ccp.ui.v2') || '{}'); u.tab = 'admin'; ls('ccp.ui.v2', JSON.stringify(u)); }catch(x){} done(r.data.session); }
            else { sb.auth.signOut().then(function(){ busy(false); var mm = msgEl(); mm.textContent = ltx('admno'); mm.style.color = 'var(--danger)'; }); }
          }, function(){ busy(false); say('net'); });
        }, fail);
      }
    }
    host.addEventListener('submit', function(e){ e.preventDefault(); act('go'); });
    host.addEventListener('click', function(e){ var b = e.target.closest && e.target.closest('button[data-m]'); if(b){ e.preventDefault(); act(b.dataset.m); } });
  });
}
function askNewPassword(){
  var host = document.createElement('div'); host.className = 'modal';
  host.innerHTML = '<form class="dialog stack" dir="' + (lang() === 'ar' ? 'rtl' : 'ltr') + '"><h2>' + esc(tx('newpass')) + '</h2><input type="password" id="ccpNP" autocomplete="new-password" dir="ltr" style="width:100%;min-height:44px;border:1px solid var(--rule);border-radius:10px;background:var(--panel);padding:9px 12px"><p class="note" id="ccpNM"></p><button class="btn primary" type="submit">' + esc(tx('save')) + '</button></form>';
  document.body.appendChild(host);
  host.querySelector('form').addEventListener('submit', function(e){ e.preventDefault(); var p = host.querySelector('#ccpNP').value; if(p.length < 6){ host.querySelector('#ccpNM').textContent = tx('need'); return; }
    sb.auth.updateUser({password:p}).then(function(r){ host.querySelector('#ccpNM').textContent = r.error ? tx('net') : tx('saved'); if(!r.error) setTimeout(function(){ host.remove(); }, 1500); }); });
}
function getSession(){
  if(sessP) return sessP;
  sessP = new Promise(function(resolve){
    if(!sb){ resolve(null); return; }
    sb.auth.getSession().then(function(r){
      var s = r && r.data && r.data.session;
      if(s){ finish(s, resolve); return; }
      var ok = false; try{ ok = sessionStorage.getItem('ccp.localok') === '1'; }catch(x){} if(ls('ccp.localonly') === '1' && ok){ resolve(null); return; }
      showLogin().then(resolve);
    }, function(){ resolve(null); });
  });
  return sessP;
}
if(sb) sb.auth.onAuthStateChange(function(ev){ if(ev === 'PASSWORD_RECOVERY') askNewPassword(); });

var user = {
  id:function(){ return getSession().then(function(s){ return s ? s.user.id : null; }); },
  email:function(){ return getSession().then(function(s){ return s ? s.user.email : null; }); },
  canEdit:function(){ return sb.rpc('compass_is_admin').then(function(r){ return !!(r && r.data === true); }, function(){ return false; }); }
};
window.claude = {standalone:true, use:function(name){
  if(name === 'downloads') return Promise.resolve(downloads);
  if(name === 'db') return getSession().then(function(s){ if(!s) throw {code:'not_granted'}; return db; });
  if(name === 'user') return getSession().then(function(s){ if(!s) throw {code:'not_granted'}; return user; });
  return Promise.reject({code:'capability_disabled'});
}};

/* prefill the teacher registration form with the name given at sign-up */
new MutationObserver(function(){ var el = document.getElementById('rgName'), n = ls('ccp.pendingName'); if(el && n && !el.value){ el.value = n; } if(el && n && el.value) ls('ccp.pendingName', null); }).observe(document.documentElement, {childList:true, subtree:true});
/* header button: sign out, or sign in when working on this device only */
document.addEventListener('DOMContentLoaded', function(){
  var bar = document.querySelector('.top-actions'); if(!bar) return;
  var b = document.createElement('button'); b.className = 'tbtn'; b.id = 'ccpAuthBtn'; b.hidden = true; bar.insertBefore(b, bar.firstChild);
  function paint(){ b.textContent = session ? tx('out') : tx('in'); b.title = session ? session.user.email : ''; b.hidden = false; }
  getSession().then(paint);
  b.addEventListener('click', function(){
    if(!sb){ alert(tx('offline')); return; }
    if(session){ sb.auth.signOut().then(function(){ wipeLocal(); ls('ccp.uid', null); ls('ccp.localonly', null); location.href = location.href.split('#')[0]; }); }
    else { ls('ccp.localonly', null); location.reload(); }
  });
  document.addEventListener('click', function(e){ if(e.target && e.target.id === 'btnLang') setTimeout(paint, 30); });
});
})();
</script>

  var fs = n<=6 ? 11 : n<=10 ? 9 : n<=16 ? 7 : n<=24 ? 5.6 : n<=32 ? 4.6 : 3.8, maxc = n<=10 ? 12 : n<=24 ? 14 : 16;
  function p(deg){ var a = deg*Math.PI/180; return (r*Math.sin(a)).toFixed(2) + ' ' + (-r*Math.cos(a)).toFixed(2); }
  names.forEach(function(nm, i){

    if(n === 1) out += '<circle r="'+r+'" fill="'+cols[0]+'" stroke="#13201A" stroke-width=".6"/>';

function parseNames(text){
  return text.split(/\r?\n/).map(function(line){ return line.trim(); }).filter(Boolean).map(function(line){
    var parts = line.split(/\s*[|\t]\s*|\s*;\s*/).map(function(p){ return p.trim(); }).filter(function(p){ return p !== ''; });
    if(parts.length >= 3) return {code:parts[0].slice(0,30), name:parts[1].slice(0,60), cls:parts[2].slice(0,60)};
    if(parts.length === 2) return {code:parts[0].slice(0,30), name:parts[1].slice(0,60), cls:''};
    return {code:'', name:line.replace(/\s+/g,' ').slice(0,60), cls:''};
  }).filter(function(x){ return x.name; });
}
function buildStudents(list, old){
  old = old || [];
  return list.slice(0,80).map(function(x){
    var keep = null;
    for(var i=0;i<old.length;i++){ if((x.code && old[i].code === x.code) || old[i].name === x.name){ keep = old[i]; old = old.slice(0,i).concat(old.slice(i+1)); break; } }
    return {id: keep ? keep.id : uid(), name:x.name, code:x.code, phone: keep ? keep.phone : ''};
  });
}

var balls = {list:[], raf:0, last:0};
var BALL_COLS = ['#F4B73E','#FF8466','#8FE0B1','#FFFFFF','#9EC9F0','#F7D774'];
function ballsOn(){ return !reduce && !PHONE && ui.balls !== false && live.noise.show && (ui.micOn || !!live.noise.manual) && !live.star; }
function ballsKick(){ if(!balls.raf && ballsOn()){ balls.last = 0; balls.raf = requestAnimationFrame(ballsTick); } else if(!ballsOn()){ var cv = $('#balls'); if(cv) cv.hidden = true; } }
function ballsTick(ts){
  var cv = $('#balls'); if(!cv){ balls.raf = 0; return; }
  if(!ballsOn()){ cv.hidden = true; balls.raf = 0; return; }
  cv.hidden = false;
  var rc = cv.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
  var W = Math.max(2, Math.round(rc.width * dpr)), H = Math.max(2, Math.round(rc.height * dpr));
  if(cv.width !== W || cv.height !== H){ cv.width = W; cv.height = H; balls.list = []; }
  if(!balls.list.length){ var R = Math.max(7 * dpr, Math.min(W, H) * 0.032); for(var i = 0; i < 24; i++){ var r = R * (0.7 + Math.random() * 0.6); balls.list.push({x: r + Math.random() * (W - 2 * r), y: H - r, vx:0, vy:0, r:r, c:BALL_COLS[i % BALL_COLS.length]}); } }
  var dt = balls.last ? Math.min(0.04, (ts - balls.last) / 1000) : 0.016; balls.last = ts;
  var nz = $('#stNoise'), F = H; if(nz && !nz.hidden){ var nr = nz.getBoundingClientRect(); if(nr.height) F = Math.max(H * 0.5, Math.round((nr.top - rc.top) * dpr) - 6 * dpr); }
  var lvl = noiseLevel(), e = lvl < 38 ? 0 : Math.min(1, (lvl - 30) / 65), g = H * 2.2, moving = false;
  balls.list.forEach(function(b){
    if(e > 0 && Math.random() < (0.05 + e * 0.3)){ b.vy -= (0.5 + Math.random()) * e * H * 1.1; b.vx += (Math.random() - 0.5) * e * W * 0.9; }
    b.vy += g * dt; b.vx *= e > 0 ? 0.992 : 0.86;
    b.x += b.vx * dt; b.y += b.vy * dt;
    if(b.x < b.r){ b.x = b.r; b.vx = Math.abs(b.vx) * 0.8; } else if(b.x > W - b.r){ b.x = W - b.r; b.vx = -Math.abs(b.vx) * 0.8; }
    if(b.y < b.r){ b.y = b.r; b.vy = Math.abs(b.vy) * 0.5; }
    if(b.y > F - b.r){ b.y = F - b.r; b.vy = -Math.abs(b.vy) * (e > 0 ? 0.6 : 0.3); if(Math.abs(b.vy) < 40 * dpr) b.vy = 0; }
    if(Math.abs(b.vx) < 2 * dpr && e === 0) b.vx = 0;
    if(b.vx || b.vy || b.y < F - b.r - 0.5) moving = true;
  });
  var x = cv.getContext('2d'); x.clearRect(0, 0, W, H);
  balls.list.forEach(function(b){ x.beginPath(); x.arc(b.x, b.y, b.r, 0, Math.PI * 2); x.fillStyle = b.c; x.globalAlpha = 0.92; x.fill(); x.globalAlpha = 0.35; x.beginPath(); x.arc(b.x - b.r * 0.3, b.y - b.r * 0.35, b.r * 0.32, 0, Math.PI * 2); x.fillStyle = '#FFFFFF'; x.fill(); x.globalAlpha = 1; });
  balls.raf = requestAnimationFrame(ballsTick);
}

function setSolo(on, tools){
  document.body.classList.toggle('solo', on); document.body.classList.toggle('tools', !!(on && tools));
  if(on){ if(ui.tab !== 'class') go('class'); try{ var el = document.documentElement; if(el.requestFullscreen) el.requestFullscreen().catch(function(){}); }catch(e){} }
  else { try{ if(document.fullscreenElement) document.exitFullscreen().catch(function(){}); }catch(e){} }
  renderMini();
}
document.addEventListener('fullscreenchange', function(){ if(!document.fullscreenElement && document.body.classList.contains('solo')){ /* keep solo; exit button is on screen */ } });
document.addEventListener('keydown', function(e){ if(e.key === 'Escape'){ if(!$('#modal').hidden){ $('#modal').hidden = true; } else if(document.body.classList.contains('solo')) setSolo(false); } });

/* ================= refresh ================= */
function refresh(full){
  if(full && ui.tab !== 'class') go(ui.tab);
  renderStage(); renderRail(); renderMini(); tick();
  if(ui.tab === 'records' && !full) renderRecords();
  if(ui.tab === 'stars' && !full) renderStars();
  if(ui.tab === 'hw') renderHwList();
  if(fl.on) drawFloat();
  $('#btnExport').disabled = !downloads;
}

/* ================= events ================= */
var toastT = 0;
function toast(msg){ var el = $('#toast'); el.textContent = msg; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function(){ el.classList.remove('on'); }, 3400); }
function confirmStep(btn){
  if(btn.dataset.armed === '1'){ delete btn.dataset.armed; return true; }
  btn.dataset.armed = '1'; var old = btn.textContent; btn.textContent = t('confirm');
  setTimeout(function(){ if(btn.isConnected && btn.dataset.armed === '1'){ delete btn.dataset.armed; btn.textContent = old; } }, 3500);
  return false;
}
document.addEventListener('pointerdown', unlockAudio, {passive:true});
document.addEventListener('keydown', unlockAudio);
document.addEventListener('click', function(ev){
  var b = ev.target.closest ? ev.target.closest('[data-act]') : null;
  if(!b || b.disabled) return;
  if(b.tagName === 'A') return;
  if(b.hasAttribute('data-confirm') && !confirmStep(b)) return;
  var id = b.dataset.id;
  switch(b.dataset.act){
    case 'tab': if(b.dataset.tab === 'classes') ui.editing = null; go(b.dataset.tab); break;
    case 'lang': ui.lang = ui.lang === 'ar' ? 'en' : 'ar'; saveUi(); applyLang(); go(ui.tab); break;
    case 'mini': ui.mini = !ui.mini; saveUi(); renderMini(); break;
    case 'solo': setSolo(true, false); break;
    case 'tools': setSolo(true, true); break;
    case 'soloExit': setSolo(false); break;
    case 'phone': openConnect(); break;
    case 'closeModal': $('#modal').hidden = true; break;
    case 'copyLink': copyText(APP_URL + '#phone'); break;
    case 'export': exportBackup(); break;
    case 'import':
      if(S.classes.length && Date.now() - ui.importArmed > 6000){ ui.importArmed = Date.now(); toast(t('import_confirm')); break; }
      ui.importArmed = 0; $('#fileImport').click(); break;
    case 'random': random(); break;
    case 'spin': spin(); break;
    case 'wheel': toggleWheel(); break;
    case 'noise': toggleNoise(); break;
    case 'micStart': micStart(); break;
    case 'micStop': micStop(); break;
    case 'manualNoise': live.noise.manual = live.noise.manual === b.dataset.v ? null : b.dataset.v; live.noise.show = true; live.noise.at = Date.now(); commitLive(); break;
    case 'float': floatToggle(); break;
    case 'pin': pinOpen(); break;
    case 'stepStu': stepStu(+b.dataset.d); break;
    case 'starDay': showStar('day'); break;
    case 'starWeek': showStar('week'); break;
    case 'hideStar': live.star = null; commitLive(); break;
    case 'award': award(b.dataset.a); break;
    case 'plus1': award('plus', id); break;
    case 'minus1': award('minus', id); break;
    case 'enc': encourage(+b.dataset.i); break;
    case 'pick': pick(id); break;
    case 'att': cycleAtt(id); break;
    case 'clear': clearDisplay(); break;
    case 'resetTurns': live.picked = []; commitLive(); break;
    case 'timer': timerToggle(); break;
    case 'timerReset': timerReset(); break;
    case 'preset': timerSet(+b.dataset.min); break;
    case 'customMin': { var v = +($('#customMin').value); if(v > 0) timerSet(v); break; }
    case 'csv': recordsCsv(); break;
    case 'printable': recordsPrintable(); break;
    case 'snapshot': snapshot(); break;
    case 'repCsv': repCsv(id); break;
    case 'repHtml': repHtml(id); break;
    case 'repDel': repDel(id); break;
    case 'refreshStars': renderStars(); toast(t('refresh') + ' ✓'); break;
    case 'cert': certificate(b.dataset.kind); break;
    case 'hwCopy': { var c = cls(), h = null; if(c) c.homework.forEach(function(x){ if(x.id === id) h = x; }); if(h) copyText(h.title + (h.details ? '\n' + h.details : '')); break; }
    case 'hwCopyDraft': { var tt = $('#hwTitle').value.trim(), dd = $('#hwDetails').value.trim(); if(tt || dd) copyText(tt + (dd ? '\n' + dd : '')); break; }
    case 'hwDel': { var c2 = cls(); if(c2){ c2.homework = c2.homework.filter(function(x){ return x.id !== id; }); commitState(); toast(t('deleted')); } break; }
    case 'pCopy': { var o = $('#pOut').textContent; if(o) copyText(o); break; }
    case 'lCopy': if(letterData) copyText(letterData.text); break;
    case 'lImg': letterImage(); break;
    case 'newClassGo': ui.editing = 'new'; go('classes'); var f = $('#inCName'); if(f) f.focus(); break;
    case 'editClass': ui.editing = id; renderClasses(); break;
    case 'delClass': {
      S.classes = S.classes.filter(function(k){ return k.id !== id; });
      if(S.cur === id){ S.cur = S.classes[0] ? S.classes[0].id : null; live.cid = S.cur; live.active = null; live.msg = null; live.star = null; live.picked = []; commitLive(); }
      ui.editing = null; commitState(); resubDays(); toast(t('deleted')); renderClasses(); break; }
    case 'sample': sampleClass(); break;
    case 'profile': openRegister(); break;
    case 'install': openInstall(); break;
    case 'copyApp': copyText(APP_URL); break;
    case 'installNative': if(installEvt){ try{ installEvt.prompt(); }catch(e){} installEvt = null; $('#modal').hidden = true; } break;
    case 'regLater': $('#modal').hidden = true; break;
    case 'admReload': adm.list = null; renderAdmin(true); break;
    case 'admOpen': adm.sel = id; adm.rec = null; renderAdmin(false); break;
    case 'admRec': admRecords(b.dataset.t, id); break;
    case 'admCsv': admCsv(); break;
    case 'admMove': admTransfer(b.dataset.t, id, true); break;
    case 'admCopy': admTransfer(b.dataset.t, id, false); break;
    case 'admDelCls': admDeleteClass(b.dataset.t, id); break;
    case 'admRemoveT': admRemoveTeacher(id); break;
    case 'admSignIn': { var ab = document.getElementById('ccpAuthBtn'); if(ab) ab.click(); break; }
    default: if(b.dataset.act.charAt(0) === 'g') gAct(b.dataset.act, b, id);
  }
});
document.addEventListener('change', function(ev){
  var el = ev.target, k = el.getAttribute && el.getAttribute('data-change');
  if(el.id === 'fileImport'){ if(el.files && el.files[0]) importBackup(el.files[0]); el.value = ''; return; }
  if(!k) return;
  if(k === 'class'){ setClass(el.value); if(ui.tab !== 'class') go(ui.tab); }
  else if(k === 'norepeat'){ live.noRepeat = el.checked; if(!el.checked) live.picked = []; commitLive(); }
  else if(k === 'range'){ ui.range = el.value; saveUi(); renderRecords(); }
  else if(k === 'recstu'){ ui.recStudent = el.value; renderRecords(); }
  else if(k === 'pstudent'){ syncParentPhone(); }
  else if(k === 'gsub'){ gSubChange(el.value); }
  else if(k === 'rgOther'){ var o = $('#' + el.getAttribute('data-for')); if(o){ o.hidden = el.value !== '__o'; if(!o.hidden) o.focus(); } }
  else if(k === 'balls'){ ui.balls = el.checked; saveUi(); ballsKick(); }
  else if(k === 'sens'){ ui.sens = +el.value; saveUi(); var lb = el.parentNode.querySelector('span'); if(lb) lb.textContent = t('sens') + ' · ' + ui.sens + '%'; }
});
document.addEventListener('input', function(ev){ if(ev.target.id === 'sens'){ ui.sens = +ev.target.value; var lb = ev.target.parentNode.querySelector('span'); if(lb) lb.textContent = t('sens') + ' · ' + ui.sens + '%'; } });
document.addEventListener('submit', function(ev){
  ev.preventDefault();
  var f = ev.target;
  if(f.id === 'classForm') saveClassForm();
  else if(f.id === 'reportForm'){ S.teacher = $('#inTeacher').value.trim().slice(0,80); S.school = $('#inSchool').value.trim().slice(0,100); commitState(); toast(t('saved')); }
  else if(f.id === 'hwForm'){ var c = cls(), title = $('#hwTitle').value.trim(); if(!c || !title) return; c.homework.push({id:uid(), title:title.slice(0,120), details:$('#hwDetails').value.trim().slice(0,1200), at:Date.now()}); if(c.homework.length > 80) c.homework = c.homework.slice(-80); $('#hwTitle').value = ''; $('#hwDetails').value = ''; commitState(); toast(t('saved')); }
  else if(f.id === 'parentForm') genParent();
  else if(f.id === 'letterForm') genLetter();
  else if(f.id === 'regForm') saveRegister();
  else if(f.id === 'admCreate') admCreate();
  else if(f.id === 'admSettings') admSaveSettings();
  else if(f.id === 'gForm') gSave();
  else if(f.id === 'gBands') gSaveBands();
  else if(f.id === 'gPlanForm') gGenPlans();
});
$('#modal').addEventListener('click', function(e){ if(e.target.id === 'modal') e.currentTarget.hidden = true; });

/* ================= boot ================= */
if(PHONE) document.body.classList.add('phone');
applyLang();
go(ui.tab);
setInterval(tick, 250);
initStore();
})();
</script>
